apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "backend-assessment.fullname" . }}
  namespace: {{ .Values.namespace }}
  labels:
    app: backend-assessment
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: backend-assessment
  template:
    metadata:
      labels:
        app: backend-assessment
    spec:
      containers:
        - name: server
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PORT
              value: {{ .Values.env.PORT | quote }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.databaseURLSecret.name }}
                  key: {{ .Values.databaseURLSecret.key }}
            - name: LOG_LEVEL
              value: {{ .Values.env.LOG_LEVEL | quote }}
            - name: TRACING_ENABLED
              value: {{ .Values.env.TRACING_ENABLED | quote }}
            - name: JAEGER_ENDPOINT
              value: {{ .Values.env.JAEGER_ENDPOINT | quote }}
            - name: SERVICE_NAME
              value: {{ .Values.env.SERVICE_NAME | quote }}
            - name: ENVIRONMENT
              value: {{ .Values.env.ENVIRONMENT | quote }}
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: {{ .Values.resources.requests.cpu | quote }}
              memory: {{ .Values.resources.requests.memory | quote }}
            limits:
              cpu: {{ .Values.resources.limits.cpu | quote }}
              memory: {{ .Values.resources.limits.memory | quote }}


