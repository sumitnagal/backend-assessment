apiVersion: v1
kind: Service
metadata:
  name: backend-assessment
  namespace: {{ .Values.namespace }}
  labels:
    app: backend-assessment
spec:
  selector:
    app: backend-assessment
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
  type: {{ .Values.service.type }}


